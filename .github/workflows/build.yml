name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Compilar
        run: gradle assembleRelease --stacktrace --no-daemon

      - name: Preparar APKs
        run: |
          mkdir -p salida
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk "salida/MOJ-Downloader-v1.0.${{ github.run_number }}.apk"
          cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk "salida/MOJ-Downloader-v1.0.${{ github.run_number }}-celulares-antiguos-32bits.apk"
          ls -la salida

      - uses: actions/upload-artifact@v4
        with:
          name: MOJ-Downloader-APK
          path: salida/*.apk

      - name: Publicar versión (descarga directa desde el celular)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" salida/*.apk \
            --title "MOJ Downloader v1.0.${{ github.run_number }}" \
            --notes "Descarga **MOJ-Downloader-v1.0.${{ github.run_number }}.apk** e instálalo en tu celular. El archivo *32bits* es solo para celulares muy antiguos." \
            --latest
